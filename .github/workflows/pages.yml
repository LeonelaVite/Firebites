name: Deploy FireBites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configure public API address
        env:
          API_URL: ${{ vars.FIREBITES_API_URL }}
        run: node -e 'const fs=require("node:fs"); const url=process.env.API_URL||""; fs.writeFileSync("api-config.js", `window.FIREBITES_API_URL = ${JSON.stringify(url)};\n`);'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
